<style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial} body{margin:0;background:#f0f6ff;color:#1e293b}
header{background:#fff;padding:14px 20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
header b{font-size:22px;color:#1e40af} header b span{color:#fff;background:#2563eb;padding:2px 10px;border-radius:8px}
header p{margin:4px 0 0;color:#64748b;font-size:13px}
.wrap{max-width:900px;margin:auto;padding:20px}
.hero{background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;border-radius:20px;padding:26px;text-align:center}
.hero h1{margin:0;font-size:26px} .hero p{opacity:.9}
.card{background:#fff;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.drop{border:2px dashed #93c5fd;background:#eff6ff;border-radius:16px;padding:34px;text-align:center;cursor:pointer;color:#1e40af;font-weight:bold;font-size:16px}
.drop small{color:#64748b;font-weight:normal}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc;margin-top:12px}
button{padding:12px 18px;border:0;border-radius:12px;font-weight:bold;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff;width:100%;font-size:16px;margin-top:12px} .btn-green{background:#16a34a;color:#fff} .btn-gray{background:#e2e8f0;color:#334155}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:bold}
.q{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:12px 0}
.q b{color:#1e40af} .opt{display:block;width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin:6px 0;cursor:pointer;text-align:left} .opt:hover{border-color:#2563eb;background:#eff6ff} .opt.selected{border-color:#2563eb;background:#dbeafe}
